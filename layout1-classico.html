<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rede Francês FM — Layout 1 · Clássico</title>
<meta name="theme-color" content="#0b2a6f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
body{background:var(--sand);color:var(--deep)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.top{background:#fff;border-bottom:1px solid #e5e8f0;position:sticky;top:0;z-index:50}
.top .wrap{display:flex;align-items:center;gap:14px;height:70px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:1;min-width:0}
.brand [data-site=logo]{height:46px;display:flex}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-txt strong{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt small{color:#6a7184;font-size:.8rem}
.social{display:flex;gap:6px}
.social a,.gear{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#f0f2f8;border:0;text-decoration:none;font-size:.75rem;font-weight:800;color:var(--primary)}
.gear{font-size:1.1rem}
.hero{background:radial-gradient(1200px 400px at 80% -20%,var(--accent),transparent 60%),linear-gradient(135deg,var(--primary),var(--deep));color:#fff;padding:42px 0 90px}
.player{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
.np-art{width:190px;height:190px;border-radius:28px;background:#fff;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden;position:relative}
.np-art .np-img{width:100%;height:100%;object-fit:contain;border-radius:14px}
.live{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:99px;font-size:.75rem;font-weight:800;letter-spacing:.08em}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#9aa3b8}
body[data-player=playing] .live::before{background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}}
.player h1{font-size:clamp(1.8rem,4vw,2.8rem);margin:.3em 0 .1em;line-height:1.05}
.player .sub{opacity:.8;font-size:1.05rem}
.ctrl{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.ctrl .skip{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff}
.ctrl [data-np=play]{width:72px;height:72px;border-radius:50%;border:0;background:#fff;color:var(--primary);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.ctrl svg{width:30px;height:30px}
.vol{display:flex;align-items:center;gap:8px;margin-left:8px}
.vol input{width:130px}
.vol button{background:none;border:0;color:#fff;font-size:1.1rem}
.np-eq{color:var(--accent);height:18px;margin-left:6px}
section{margin:0 0 40px}
.sec-h{display:flex;align-items:end;justify-content:space-between;margin:0 0 14px}
.sec-h h2{margin:0;font-size:1.35rem}
.sec-h span{color:#6a7184;font-size:.85rem}
.lift{margin-top:-60px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(18,30,70,.08)}
[data-stations]{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.station{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:2px solid #edf0f6;background:#fff;text-align:left;transition:.2s;color:inherit}
.station:hover{border-color:#cdd3e2;transform:translateY(-2px)}
.station.active{border-color:var(--accent);background:#fff7f7}
.station-logo{width:54px;height:54px;flex:0 0 54px;border-radius:14px;overflow:hidden;background:#f3f5fa}
.station-logo img{width:100%;height:100%;object-fit:contain}
.station-info{flex:1;display:flex;flex-direction:column;min-width:0}
.station-info small{color:#6a7184}
.station-eq{color:var(--accent)}
.news-card [data-news] .nc-slide{grid-template-columns:1.1fr 1fr;min-height:320px;background:#fff}
.news-card .nc-media{min-height:240px}
.news-card .nc-body{padding:28px;display:flex;flex-direction:column;justify-content:center}
.news-card .nc-body h3{font-size:1.6rem}
.news-card .nc-dots{color:var(--deep)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
[data-contact]{display:flex;flex-direction:column;gap:8px}
[data-contact] .contact-btn{background:#f6f8fc;border:1px solid #edf0f6}
[data-contact] .contact-btn:hover{background:#eefaf2;border-color:#bfe9cf}
footer{padding:30px 0 90px;color:#6a7184;font-size:.85rem;text-align:center}
@media (max-width:820px){.two{grid-template-columns:1fr}.news-card [data-news] .nc-slide{grid-template-columns:1fr}.news-card .nc-media{min-height:200px}}
@media (max-width:600px){.player{grid-template-columns:1fr;text-align:center;justify-items:center}.ctrl{justify-content:center}.np-art{width:150px;height:150px}.social{display:none}.vol{width:100%;justify-content:center;margin:0}}
</style>
</head>
<body data-player="idle">
<header class="top"><div class="wrap">
  <a class="brand" href="#"><span data-site="logo"></span><span class="brand-txt"><strong data-site="nome"></strong><small data-site="slogan"></small></span></a>
  <nav class="social"><a data-site="instagram" target="_blank" rel="noopener" title="Instagram">IG</a><a data-site="youtube" target="_blank" rel="noopener" title="YouTube">YT</a><a data-site="facebook" target="_blank" rel="noopener" title="Facebook">FB</a></nav>
  <button class="gear" data-open-admin title="Painel gerencial">⚙</button>
</div></header>

<div class="hero"><div class="wrap player">
  <div class="np-art" data-np="logo"></div>
  <div>
    <span class="live" data-np="status">AO VIVO</span>
    <h1 data-np="name">Escolha uma rádio</h1>
    <div class="sub"><span data-np="sub"></span><span class="np-eq"><i></i><i></i><i></i></span></div>
    <div class="ctrl">
      <button class="skip" data-np="prev" aria-label="Rádio anterior">⏮</button>
      <button data-np="play" aria-label="Tocar">
        <svg class="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        <svg class="i-load" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M12 3a9 9 0 1 0 9 9"/></svg>
      </button>
      <button class="skip" data-np="next" aria-label="Próxima rádio">⏭</button>
      <div class="vol"><button data-np="mute" aria-label="Mudo">🔊</button><input type="range" min="0" max="1" step="0.01" data-np="vol" aria-label="Volume"></div>
    </div>
  </div>
</div></div>

<main class="wrap">
  <section class="lift card">
    <div class="sec-h"><h2>Nossas rádios</h2><span><b data-count></b> emissoras</span></div>
    <div data-stations></div>
  </section>

  <div class="two">
    <section class="news-card">
      <div class="sec-h"><h2>Principais notícias</h2><span>Top 5</span></div>
      <div class="card" style="padding:0;overflow:hidden"><div data-news></div></div>
    </section>
    <section>
      <div class="sec-h"><h2>Fale com a rádio</h2><span>WhatsApp</span></div>
      <div class="card"><div data-contact></div></div>
    </section>
  </div>
</main>
<footer>© <span data-site="nome"></span> · Layout 1 — Clássico</footer>
<script src="app.js"></script>
</body>
</html>
