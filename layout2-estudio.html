<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rede Francês FM — Layout 2 · Estúdio</title>
<meta name="theme-color" content="#0a0d16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
body{background:color-mix(in srgb,var(--deep) 55%,#000);color:#e8ebf3;min-height:100vh}
.app{display:grid;grid-template-columns:290px 1fr 320px;min-height:100vh;padding-bottom:88px}
aside{background:color-mix(in srgb,var(--deep) 70%,#000);border-right:1px solid #1c2232;padding:20px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:calc(100vh - 88px);overflow:auto}
.logo-box{display:flex;align-items:center;gap:10px}
.logo-box [data-site=logo]{height:42px;display:flex;background:#fff;border-radius:10px;padding:4px}
.logo-box strong{display:block;font-size:.95rem}
.logo-box small{color:#8890a6;font-size:.75rem}
.lbl{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#6d7590;font-weight:800;margin:6px 4px 0}
[data-stations]{display:flex;flex-direction:column;gap:6px}
.station{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:0;background:transparent;color:inherit;text-align:left;transition:.15s}
.station:hover{background:#171c2a}
.station.active{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 30%,transparent),transparent);box-shadow:inset 3px 0 0 var(--accent)}
.station-logo{width:42px;height:42px;flex:0 0 42px;border-radius:10px;overflow:hidden;background:#fff}
.station-logo img{width:100%;height:100%;object-fit:contain}
.station-info{flex:1;display:flex;flex-direction:column;min-width:0}
.station-info strong{font-size:.9rem}
.station-info small{color:#8890a6;font-size:.75rem}
.station-eq{color:var(--accent)}
.side-foot{margin-top:auto;display:flex;gap:8px}
.side-foot a,.side-foot button{flex:1;padding:9px;border-radius:10px;background:#171c2a;border:0;color:#c9cfdd;text-align:center;text-decoration:none;font-size:.75rem;font-weight:700}
main{padding:28px 32px;display:flex;flex-direction:column;gap:28px;min-width:0}
.stage{position:relative;border-radius:26px;padding:34px;background:radial-gradient(600px 300px at 15% 10%,color-mix(in srgb,var(--primary) 70%,transparent),transparent),radial-gradient(500px 300px at 90% 90%,color-mix(in srgb,var(--accent) 45%,transparent),transparent),color-mix(in srgb,var(--deep) 80%,#000);display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;overflow:hidden;border:1px solid #1f2638}
.disc{width:220px;height:220px;border-radius:50%;background:repeating-radial-gradient(circle,#0b0e17 0 2px,#151a28 2px 4px);display:grid;place-items:center;box-shadow:0 30px 60px rgba(0,0,0,.5)}
body[data-player=playing] .disc{animation:spin 8s linear infinite}
.disc [data-np=logo]{width:110px;height:110px;border-radius:50%;background:#fff;overflow:hidden;padding:10px;border:4px solid var(--accent)}
.disc .np-img{width:100%;height:100%;object-fit:contain}
.on-air{display:inline-flex;gap:8px;align-items:center;font-size:.75rem;font-weight:900;letter-spacing:.14em;color:#ff9da1}
.on-air b{background:var(--accent);color:#fff;padding:3px 9px;border-radius:6px}
.stage h1{font-size:clamp(2rem,3.5vw,3.2rem);margin:.25em 0 .1em;line-height:1}
.stage .sub{color:#aab1c4}
.wave{display:flex;gap:4px;align-items:flex-end;height:40px;margin-top:22px}
.wave i{flex:1;max-width:8px;background:linear-gradient(var(--accent),var(--primary));border-radius:4px;height:15%;transition:.3s}
body[data-player=playing] .wave i{animation:eq 1.1s ease-in-out infinite}
.h2{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.h2 h2{margin:0;font-size:1.15rem}
.h2 small{color:#8890a6}
[data-news] .nc-slide{grid-template-columns:1fr;background:color-mix(in srgb,var(--deep) 80%,#000);border:1px solid #1f2638;border-radius:var(--radius);overflow:hidden}
[data-news] .nc-media{height:240px}
[data-news] .nc-body{padding:20px 22px 24px}
[data-news] .nc-body h3{font-size:1.4rem}
[data-news] .nc-dots{color:#e8ebf3}
.right{background:color-mix(in srgb,var(--deep) 70%,#000);border-left:1px solid #1c2232;padding:24px 18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:calc(100vh - 88px);overflow:auto}
[data-contact]{display:flex;flex-direction:column;gap:8px}
[data-contact] .contact-btn{background:#171c2a;border:1px solid #232a3c}
[data-contact] .contact-btn:hover{border-color:var(--wa)}
.promo{border-radius:18px;padding:18px;background:linear-gradient(135deg,var(--accent),var(--primary));font-size:.9rem}
.promo strong{display:block;font-size:1.1rem;margin-bottom:4px}
.bar{position:fixed;left:0;right:0;bottom:0;height:88px;background:rgba(12,15,25,.92);backdrop-filter:blur(14px);border-top:1px solid #1f2638;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;z-index:60}
.bar-now{display:flex;align-items:center;gap:12px;min-width:0}
.bar-now [data-np=logo]{width:52px;height:52px;border-radius:10px;overflow:hidden;background:#fff;flex:0 0 52px}
.bar-now .np-img{width:100%;height:100%;object-fit:contain}
.bar-now div{min-width:0;display:flex;flex-direction:column}
.bar-now strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-now small{color:#8890a6;font-size:.78rem}
.bar-ctrl{display:flex;align-items:center;gap:12px}
.bar-ctrl .skip{background:none;border:0;color:#c9cfdd;font-size:1.1rem;width:40px;height:40px;border-radius:50%}
.bar-ctrl .skip:hover{background:#1a2030}
.bar-ctrl [data-np=play]{width:54px;height:54px;border-radius:50%;border:0;background:#fff;color:#0a0d16;display:grid;place-items:center}
.bar-ctrl svg{width:24px;height:24px}
.bar-vol{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.bar-vol button{background:none;border:0;color:#c9cfdd}
.bar-vol input{width:140px}
#wa-fab{bottom:104px}
@media (max-width:1180px){.app{grid-template-columns:260px 1fr}.right{position:static;height:auto;grid-column:2;border:0;background:none;padding:0 32px 28px}}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border:0}.right{grid-column:1;padding:0 18px 20px}main{padding:18px}.stage{grid-template-columns:1fr;justify-items:center;text-align:center;padding:24px}.disc{width:170px;height:170px}.wave{justify-content:center}.bar{grid-template-columns:1fr auto}.bar-vol{display:none}.bar-ctrl .skip{display:none}}
</style>
</head>
<body data-player="idle">
<div class="app">
  <aside>
    <div class="logo-box"><span data-site="logo"></span><div><strong data-site="nome"></strong><small data-site="slogan"></small></div></div>
    <div class="lbl">Emissoras · <span data-count></span></div>
    <div data-stations></div>
    <div class="side-foot">
      <a data-site="instagram" target="_blank" rel="noopener">Instagram</a>
      <a data-site="youtube" target="_blank" rel="noopener">YouTube</a>
      <button data-open-admin title="Painel gerencial">⚙ Painel</button>
    </div>
  </aside>

  <main>
    <div class="stage">
      <div class="disc"><div data-np="logo"></div></div>
      <div>
        <span class="on-air"><b>ON AIR</b><span data-np="status"></span></span>
        <h1 data-np="name">Escolha uma rádio</h1>
        <div class="sub" data-np="sub"></div>
        <div class="wave" aria-hidden="true"><i style="animation-delay:.1s"></i><i style="animation-delay:.5s"></i><i style="animation-delay:.2s"></i><i style="animation-delay:.7s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.9s"></i><i style="animation-delay:.15s"></i><i style="animation-delay:.6s"></i><i style="animation-delay:.35s"></i><i style="animation-delay:.8s"></i><i style="animation-delay:.05s"></i><i style="animation-delay:.45s"></i><i style="animation-delay:.25s"></i><i style="animation-delay:.65s"></i><i style="animation-delay:.4s"></i><i style="animation-delay:.85s"></i><i style="animation-delay:.12s"></i><i style="animation-delay:.55s"></i></div>
      </div>
    </div>
    <section>
      <div class="h2"><h2>📰 As 5 principais</h2><small>arraste para o lado</small></div>
      <div data-news></div>
    </section>
  </main>

  <div class="right">
    <div class="h2"><h2>💬 Fale com a gente</h2></div>
    <div data-contact></div>
    <div class="promo"><strong>Anuncie aqui</strong>Sua marca nas rádios da rede. Toque em “Comercial” para falar com nosso time.</div>
  </div>
</div>

<div class="bar">
  <div class="bar-now"><span data-np="logo"></span><div><strong data-np="name"></strong><small data-np="sub"></small></div></div>
  <div class="bar-ctrl">
    <button class="skip" data-np="prev" aria-label="Rádio anterior">⏮</button>
    <button data-np="play" aria-label="Tocar">
      <svg class="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      <svg class="i-load" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M12 3a9 9 0 1 0 9 9"/></svg>
    </button>
    <button class="skip" data-np="next" aria-label="Próxima rádio">⏭</button>
  </div>
  <div class="bar-vol"><button data-np="mute" aria-label="Mudo">🔊</button><input type="range" min="0" max="1" step="0.01" data-np="vol" aria-label="Volume"></div>
</div>
<script src="app.js"></script>
</body>
</html>
