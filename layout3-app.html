<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rede Francês FM — Layout 3 · App</title>
<meta name="theme-color" content="#0b2a6f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
body{background:color-mix(in srgb,var(--sand) 70%,#cfd6df);color:var(--deep)}
.phone{max-width:480px;margin:0 auto;min-height:100vh;background:var(--sand);position:relative;padding-bottom:110px;box-shadow:0 0 60px rgba(20,30,60,.12)}
.head{background:linear-gradient(160deg,var(--primary),color-mix(in srgb,var(--primary) 70%,var(--accent)));color:#fff;padding:18px 18px 70px;border-radius:0 0 30px 30px}
.head-row{display:flex;align-items:center;gap:10px}
.head [data-site=logo]{height:40px;display:flex;background:#fff;border-radius:12px;padding:4px}
.head-row>div{flex:1;min-width:0}
.head strong{display:block}
.head small{opacity:.8;font-size:.78rem}
.gear{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.1rem}
.greet{margin:22px 0 0;font-size:1.5rem;font-weight:800;line-height:1.15}
.greet span{opacity:.75;font-weight:600;font-size:.95rem;display:block}
.pad{padding:0 16px}
.news-wrap{margin-top:-52px}
[data-news] .nc-slide{position:relative;height:230px;grid-template-columns:1fr;border-radius:22px;overflow:hidden;color:#fff}
[data-news] .nc-media{position:absolute;inset:0}
[data-news] .nc-media::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,rgba(0,0,0,.82))}
[data-news] .nc-num{top:12px;right:14px;left:auto;bottom:auto;font-size:2rem;opacity:.5;z-index:1}
[data-news] .nc-body{position:relative;z-index:1;align-self:end;padding:18px}
[data-news] .nc-body h3{font-size:1.15rem}
[data-news] .nc-body p{font-size:.82rem;-webkit-line-clamp:1}
[data-news] .nc-meta{opacity:.9}
[data-news] .nc-viewport{border-radius:22px;box-shadow:0 14px 30px rgba(20,30,60,.2)}
[data-news] .nc-dots{color:#141a2b}
.h{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}
.h h2{margin:0;font-size:1.05rem}
.h small{color:#6a7184}
[data-stations]{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.station{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:20px;border:0;background:#fff;text-align:left;color:inherit;box-shadow:0 4px 14px rgba(20,30,60,.06);transition:.2s}
.station:active{transform:scale(.97)}
.station.active{background:var(--primary);color:#fff}
.station-logo{width:52px;height:52px;border-radius:14px;overflow:hidden;background:#f2f4f9}
.station-logo img{width:100%;height:100%;object-fit:contain}
.station-info{display:flex;flex-direction:column}
.station-info strong{font-size:.9rem;line-height:1.2}
.station-info small{opacity:.7;font-size:.75rem}
.station-eq{position:absolute;right:14px;top:14px;color:var(--accent)}
.station.active .station-eq{color:#fff}
.contact-grid [data-contact]{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.contact-grid .contact-btn{flex-direction:column;text-align:center;background:#fff;border-radius:20px;padding:14px 8px;gap:8px;box-shadow:0 4px 14px rgba(20,30,60,.06)}
.contact-grid .contact-ico{width:48px;height:48px;font-size:1.5rem}
.contact-grid .contact-txt strong{font-size:.82rem}
.contact-grid .contact-txt small{font-size:.68rem}
.contact-grid .contact-wa{display:none}
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(456px,calc(100% - 24px));background:var(--deep);color:#fff;border-radius:24px;padding:10px 10px 10px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 18px 40px rgba(10,15,30,.35);z-index:60}
.mini [data-np=logo]{width:52px;height:52px;border-radius:16px;overflow:hidden;background:#fff;flex:0 0 52px}
.mini .np-img{width:100%;height:100%;object-fit:contain}
.mini-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.mini-txt strong{font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-txt small{font-size:.74rem;color:#aab1c4;display:flex;gap:6px;align-items:center}
.mini-txt .np-eq{color:var(--accent);height:10px}
.mini .skip{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:1rem}
.mini [data-np=play]{width:50px;height:50px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:0 0 50px}
.mini svg{width:22px;height:22px}
.prog{position:absolute;left:22px;right:22px;top:0;height:3px;border-radius:3px;overflow:hidden}
body[data-player=playing] .prog::after{content:"";position:absolute;inset:0;width:30%;background:var(--accent);animation:slide 1.6s ease-in-out infinite}
@keyframes slide{0%{left:-30%}100%{left:100%}}
#wa-fab{bottom:100px;right:max(18px,calc(50% - 222px))}
.social-row{display:flex;gap:8px;margin-top:20px}
.social-row a{flex:1;text-align:center;padding:12px;border-radius:14px;background:#fff;text-decoration:none;font-size:.8rem;font-weight:700;color:var(--primary);box-shadow:0 4px 14px rgba(20,30,60,.06)}
</style>
</head>
<body data-player="idle">
<div class="phone">
  <header class="head">
    <div class="head-row">
      <span data-site="logo"></span>
      <div><strong data-site="nome"></strong><small data-site="slogan"></small></div>
      <button class="gear" data-open-admin aria-label="Painel gerencial">⚙</button>
    </div>
    <p class="greet"><span>Bem-vindo! Ouça agora</span><b data-np="name"></b></p>
  </header>

  <div class="pad">
    <div class="news-wrap"><div data-news></div></div>

    <div class="h"><h2>📻 Rádios</h2><small><span data-count></span> emissoras</small></div>
    <div data-stations></div>

    <div class="h"><h2>💬 Fale com a rádio</h2><small>WhatsApp</small></div>
    <div class="contact-grid"><div data-contact></div></div>

    <div class="social-row">
      <a data-site="instagram" target="_blank" rel="noopener">Instagram</a>
      <a data-site="youtube" target="_blank" rel="noopener">YouTube</a>
      <a data-site="facebook" target="_blank" rel="noopener">Facebook</a>
    </div>
  </div>
</div>

<div class="mini">
  <span class="prog"></span>
  <span data-np="logo"></span>
  <div class="mini-txt"><strong data-np="name"></strong><small><span class="np-eq"><i></i><i></i><i></i></span><span data-np="status"></span></small></div>
  <button class="skip" data-np="next" aria-label="Próxima rádio">⏭</button>
  <button data-np="play" aria-label="Tocar">
    <svg class="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    <svg class="i-load" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M12 3a9 9 0 1 0 9 9"/></svg>
  </button>
</div>
<script src="app.js"></script>
</body>
</html>
